<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame Splitter</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f8f9fb; --line:#e3e6eb;
  --fg:#1c2024; --dim:#6b7280; --accent:#2563eb; --accent2:#1d4ed8;
  --danger:#dc2626; --r:12px;
  --sh:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
/* スクロールバーの出入りで画面幅が変わると、中央に固定したボタンが横にずれる。
   常に同じ幅を確保して、ずれないようにする。 */
html{scrollbar-gutter:stable;overflow-y:scroll}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Segoe UI","Yu Gothic UI",-apple-system,sans-serif;font-size:14px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:30px 20px 30px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.02em}
.sub{color:var(--dim);font-size:13px;margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:20px;margin-bottom:16px}
.drop{border:2px dashed #c7cdd6;border-radius:var(--r);padding:20px;text-align:center;
  cursor:pointer;transition:.15s;background:var(--panel2);
  height:calc(100vh - 272px);min-height:280px;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.drop:hover,.drop.over{border-color:var(--accent);background:#eef4ff}
.drop .big{font-size:16px;margin-bottom:8px}
.drop .small{color:var(--dim);font-size:12px}
.drop.compact{height:auto;padding:72px 20px;display:block}
.drop.compact .big{font-size:14px;margin-bottom:4px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:16px}
.thumb{position:relative;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:8px}
.thumb img{width:100%;height:84px;object-fit:contain;border-radius:6px;background:#fff}
.thumb .meta{font-size:11px;color:var(--dim);margin-top:6px;text-align:center}
.x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
  border:none;background:var(--danger);color:#fff;cursor:pointer;font-size:13px;line-height:1;padding:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;
  padding:11px 24px;font-size:14px;font-family:inherit;cursor:pointer;transition:.15s}
button.btn:hover{background:var(--accent2)}
button.btn:disabled{opacity:.4;cursor:default}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--dim)}
button.ghost:hover{background:var(--panel2);color:var(--fg)}
input[type=text],input[type=password],textarea{width:100%;background:#fff;
  border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:10px 12px;
  font-family:inherit;font-size:14px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:62px}
label.lb{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.preview{text-align:center}
.checker{display:inline-block;border-radius:10px;border:1px solid var(--line);padding:6px;
  background:repeating-conic-gradient(#eef0f3 0 25%, #fff 0 50%) 0 0/16px 16px}
.preview img{max-width:100%;max-height:calc(100vh - 210px);display:block;border-radius:6px}
.info{color:var(--dim);font-size:12px;margin-top:10px}
#resultCard{margin-bottom:120px;cursor:pointer}
#resultActions{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;
  margin:0;padding:10px 12px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:14px;
  box-shadow:0 6px 24px rgba(16,24,40,.14);flex-wrap:nowrap}
.err{color:var(--danger);font-size:13px;margin-top:10px}
body.empty .wrap{padding-bottom:14px}
body.empty .card{margin-bottom:0}
body.empty .thumbs{margin-top:0}
.hide{display:none!important}
</style>
</head>
<body class="empty">
<div class="wrap">
  <h1>Frame Splitter</h1>
  <p class="sub">画像を余白なしで1枚へまとめます。幅をそろえて段に組み、縮小はしません。</p>

  <div class="card">
    <div class="drop" id="drop">
      <div class="big">画像をここにドロップ</div>
      <div class="small">クリックして選ぶこともできます。貼り付け（Ctrl+V）も使えます。</div>
    </div>
    <input type="file" id="file" accept="image/*" multiple class="hide">
    <div class="thumbs" id="thumbs"></div>
    <div class="row" id="mergeActions" style="margin-top:16px;display:none">
      <button class="btn ghost" id="clear">全部消す</button>
    </div>
    <div class="err hide" id="mergeErr"></div>
  </div>

  <div class="card hide" id="resultCard">
    <div class="preview">
      <div class="checker"><img id="resultImg" alt=""></div>
      <div class="info" id="resultInfo"></div>
      <div class="row" id="resultActions">
        <button class="btn" id="dl">ダウンロード</button>
        <button class="btn ghost hide" id="alt">別の並びにする</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   設定
   ============================================================ */
const MAX_SIDE       = 16000;  // キャンバスの一辺の上限（ブラウザ制限）
const ASPECT_TARGET  = 1.15;   // 目指す縦横比。1 が正方形。少しだけ横長寄りにしている
const ASPECT_WEIGHT  = 1.00;   // 正方形からの遠さに対する減点。上げるほど正方形寄りを先に出す
const UPSCALE_WEIGHT = 1.5;    // 拡大に対する減点。上げるほど元のサイズを保とうとする
const MAX_CANDIDATES = 6;      // 「別の並びにする」で回せる候補の数

/* ============================================================
   並べ方（幅そろえ・段組み）

   画像を何段かに分け、同じ段の画像は高さをそろえ、各段の合計幅を
   キャンバス幅にぴったり合わせます。この作り方なら余白は常にゼロです。

   縮小はしません。段の高さは、その段で一番背の高い元画像に合わせるので、
   どの画像も元のサイズ以上になります。小さい画像は拡大して幅をそろえます。

   分け方をすべて試し、次の式で採点して良い順に候補を残します。
     点数 ＝ −（正方形からの遠さ × ASPECT_WEIGHT）−（拡大の大きさ × UPSCALE_WEIGHT）
   正方形に近いものほど先に出ます。
   ============================================================ */
function packCandidates(items){
  const n = items.length;
  const groups = n <= 9 ? allPartitions(n) : rowSplits(n);
  const bySize = new Map();
  for(const g of groups){
    const L = layoutFor(items, g);
    if(!L) continue;
    L.score = -ASPECT_WEIGHT * Math.abs(Math.log((L.W / L.H) / ASPECT_TARGET))
              -UPSCALE_WEIGHT * L.up;
    const key = L.W + "x" + L.H;
    const prev = bySize.get(key);
    if(!prev || L.score > prev.score) bySize.set(key, L);
  }
  return [...bySize.values()].sort((a,b)=> b.score - a.score).slice(0, MAX_CANDIDATES);
}

// 段の分け方をすべて列挙する（どの画像がどの段か。段の順序は結果に影響しない）
function allPartitions(n){
  const out = [], a = new Array(n);
  (function go(i, k){
    if(i === n){
      const g = [];
      for(let j=0;j<k;j++) g.push([]);
      for(let j=0;j<n;j++) g[a[j]].push(j);
      out.push(g);
      return;
    }
    for(let b=0;b<=k;b++){ a[i]=b; go(i+1, Math.max(k, b+1)); }
  })(0, 0);
  return out;
}

// 枚数が多いときは、順番に区切るだけにする（総当たりだと数が多すぎるため）
function rowSplits(n){
  const out = [];
  for(let rows=1; rows<=n; rows++){
    const g = [];
    for(let i=0;i<rows;i++) g.push([]);
    for(let i=0;i<n;i++) g[Math.floor(i*rows/n)].push(i);
    out.push(g);
  }
  return out;
}

function layoutFor(items, groups){
  let W = 0;
  const rows = groups.map(g=>{
    const imgs = g.map(i=>items[i]);
    const sumA = imgs.reduce((s,it)=> s + it.w/it.h, 0);
    const need = Math.max(...imgs.map(it=>it.h)) * sumA;   // 縮小させないための最低幅
    if(need > W) W = need;
    return {imgs, sumA};
  });
  W = Math.round(W);
  const placed = [];
  let y = 0, lnScale = 0, maxScale = 1;
  for(const r of rows){
    const h = W / r.sumA;
    let x = 0;
    r.imgs.forEach((it, k)=>{
      const w = (k === r.imgs.length - 1) ? (W - x) : Math.round(h * it.w / it.h);
      placed.push({x, y: Math.round(y), w, h: Math.round(h), src: it});
      const sc = h / it.h;
      lnScale += Math.log(Math.max(1, sc));
      if(sc > maxScale) maxScale = sc;
      x += w;
    });
    y += h;
  }
  const H = Math.round(y);
  if(W > MAX_SIDE || H > MAX_SIDE || W < 1 || H < 1) return null;
  return {W, H, placed, up: lnScale / items.length, maxScale};
}

// 描画。拡大が入るので、なめらかに引き伸ばす設定にする。
function drawLayout(c){
  const cv = document.createElement("canvas");
  cv.width = c.W; cv.height = c.H;
  const cx = cv.getContext("2d");
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = "high";
  for(const r of c.placed) cx.drawImage(r.src.im, r.x, r.y, r.w, r.h);
  return cv;
}

function buildLayouts(images){
  const items = images.map(im => ({w: im.naturalWidth||im.width, h: im.naturalHeight||im.height, im}));
  return packCandidates(items);
}

function saveCanvas(cv, prefix){
  cv.toBlob(b=>{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = prefix + "-" + new Date().toISOString().replace(/[:.]/g,"-").slice(0,19) + ".png";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }, "image/png");
}

function loadImage(file){
  return new Promise((res,rej)=>{
    const im = new Image();
    im.onload = ()=> res(im);
    im.onerror = rej;
    im.src = URL.createObjectURL(file);
  });
}

/* ============================================================
   画像統合
   ============================================================ */
const S = { imgs: [] };
const $ = id => document.getElementById(id);

function bindDrop(el, onFiles){
  el.onclick = ()=> $("file").click();
  el.ondragover = e=>{ e.preventDefault(); el.classList.add("over"); };
  el.ondragleave = ()=> el.classList.remove("over");
  el.ondrop = e=>{
    e.preventDefault(); el.classList.remove("over");
    onFiles([...e.dataTransfer.files].filter(f=>f.type.startsWith("image/")));
  };
}

bindDrop($("drop"), addFiles);
$("file").onchange = e => { addFiles([...e.target.files]); e.target.value=""; };
window.addEventListener("paste", e=>{
  const fs = [...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith("image/"));
  if(fs.length) addFiles(fs);
});

async function addFiles(files){
  $("mergeErr").classList.add("hide");
  for(const f of files){
    try{ S.imgs.push({im: await loadImage(f), name: f.name}); }
    catch(_){ showErr("mergeErr", "読み込めない画像がありました。"); }
  }
  refresh();
}

function refresh(){
  const t = $("thumbs"); t.innerHTML = "";
  S.imgs.forEach((o,i)=>{
    const d = document.createElement("div");
    d.className = "thumb";
    d.innerHTML = `<img src="${o.im.src}"><div class="meta">${o.im.naturalWidth} × ${o.im.naturalHeight}</div>`;
    const b = document.createElement("button");
    b.className = "x"; b.textContent = "×";
    b.onclick = ev => { ev.stopPropagation(); S.imgs.splice(i,1); refresh(); };
    d.appendChild(b);
    t.appendChild(d);
  });
  $("mergeActions").style.display = S.imgs.length ? "flex" : "none";
  $("drop").classList.toggle("compact", S.imgs.length > 0);
  document.body.classList.toggle("empty", S.imgs.length === 0);
  merge();
}

$("clear").onclick = ()=>{ S.imgs = []; refresh(); };

// 結果カードの白い部分（画像そのもの以外）をクリックしたら、はじめの状態に戻す
$("resultCard").onclick = e=>{
  if(e.target.closest("#resultActions") || e.target.closest(".checker")) return;
  S.imgs = [];
  refresh();
  window.scrollTo(0, 0);
};

let layouts = [], layoutIdx = 0, merged = null;

function merge(){
  if(S.imgs.length === 0){ $("resultCard").classList.add("hide"); layouts=[]; merged=null; return; }
  layouts = buildLayouts(S.imgs.map(o=>o.im));
  layoutIdx = 0;
  if(!layouts.length){ showErr("mergeErr","この組み合わせは大きすぎて1枚にできませんでした。"); return; }
  showLayout(true);
}

function showLayout(scrollToImage){
  const c = layouts[layoutIdx];
  merged = drawLayout(c);
  const img = $("resultImg");
  if(scrollToImage) img.onload = ()=>{
    const r = $("resultCard").querySelector(".checker").getBoundingClientRect();
    window.scrollBy(0, r.top - 20);
  };
  else img.onload = null;
  img.src = merged.toDataURL("image/png");
  $("resultInfo").textContent =
    `${c.W} × ${c.H} px`
    + (c.maxScale > 1.01 ? `　／　小さい画像を最大 ${c.maxScale.toFixed(2)} 倍に拡大` : "　／　全て原寸")
    + (layouts.length > 1 ? `　／　候補 ${layoutIdx+1} / ${layouts.length}` : "");
  $("alt").classList.toggle("hide", layouts.length < 2);
  $("resultCard").classList.remove("hide");
}

$("alt").onclick = ()=>{ layoutIdx = (layoutIdx + 1) % layouts.length; showLayout(false); };
$("dl").onclick  = ()=> merged && saveCanvas(merged, "merged");

function showErr(id, msg){ const e=$(id); e.textContent=msg; e.classList.remove("hide"); }

</script>
</body>
</html>
